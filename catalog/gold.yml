      created_date: "Data do pedido (YYYY-MM-DD)."
      mes: "Mês do pedido (YYYY-MM)."
      periodo_pix: "PRE_PIX ou POS_PIX (corte em 27/05/2026)."
      status: "APROVADO, ESTORNADO, CANCELADO, INVALIDO, AGUARDANDO_CONFIRMACAO."
      modalidade: "AEREAS, VAREJO_PRODUTO, TRANSFERENCIA_PARCEIRO ou PIX."
      category_macro: "Categoria original do sistema (Aereas, Varejo, Cashback)."
      product_type: "PASSAGEM, PRODUTO ou TRANSFERENCIA."
      supplier_name: "Fornecedor do produto."
      supplier_responsible: "Quem responde pelo pedido (difere em marketplace)."
