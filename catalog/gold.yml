      copagamento_reais: "R$ pagos pelo cliente além dos pontos."
      valor_produto_reais: "Valor do produto em R$."
      custo_pontos_reais: "Parte do valor coberta por pontos (valor - copagamento)."
      pontos_estornados_parcial: "Pontos devolvidos parcialmente em itens aprovados."
