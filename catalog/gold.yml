# Catálogo semântico da camada gold. Fonte única de documentação para o dashboard e o agente.
# É carregado no SQLite nas tabelas meta_tabelas e meta_colunas pelo pipeline.
regras_gerais:
  - "Resgate efetivado = item com status APROVADO. Estornados, cancelados e inválidos aparecem em colunas próprias."
  - "COMPRA_PONTOS (cliente compra pontos em R$) NÃO é resgate e está fora de todas as tabelas de resgate."
  - "Pix foi lançado em 27/05/2026. Taxa contratual R$ 0,019 por ponto."
  - "Metas contratuais: aéreas >= 50% e varejo >= 20% dos pontos resgatados no mês."
  - "Varejo (categoria do sistema) inclui transferências para programas parceiros; varejo_produto exclui. A definição contratual ainda não foi confirmada."
  - "Em 12/01/2026 houve um lote atípico de 1.520 resgates de aéreas (flag_lote_20260112). Use as colunas *_sem_lote para comparar tendência."
  - "Breakage do programa novo não é mensurável: nenhum crédito venceu até a extração (01/10/2026)."
  - "Custo do programa / quanto o programa paga = custo_pontos_reais (valor do produto coberto por pontos, sem o copagamento do cliente), em gold_resgates_mensal ou gold_fct_resgate. O que NÃO existe é quanto o banco paga ao programa por ponto (receita) nem margem."
  - "Datas em horário de Brasília (-03:00). mes no formato YYYY-MM."
  - "Dados de 01/10/2025 a 30/09/2026. Extração em 01/10/2026."

tabelas:
  gold_metas_mensal:
    grao: "1 linha por mês"
    descricao: "Composição dos pontos resgatados (aprovados) por mês e atingimento das metas de aéreas e varejo."
    colunas:
      mes: "Mês do resgate (YYYY-MM)."
      pontos_total: "Pontos resgatados aprovados no mês, todas as modalidades."
      pontos_aereas: "Pontos resgatados em passagens aéreas."
      pontos_varejo: "Pontos em varejo pela categoria do sistema (produtos + transferências para parceiros)."
      pontos_varejo_produto: "Pontos em produtos de varejo (sem transferências)."
      pontos_pix: "Pontos trocados por dinheiro via Pix."
      aereas_pct: "% de aéreas sobre o total de pontos resgatados. Meta >= 50."
      varejo_pct: "% de varejo (categoria do sistema) sobre o total. Meta >= 20."
      varejo_produto_pct: "% de varejo só produtos sobre o total (definição alternativa)."
      pix_pct: "% de Pix sobre o total."
      aereas_pct_sem_pix: "% de aéreas se o Pix fosse excluído do denominador (interpretação alternativa do contrato)."
      varejo_pct_sem_pix: "% de varejo se o Pix fosse excluído do denominador."
      aereas_pct_sem_lote: "% de aéreas excluindo o lote atípico de 12/01/2026."
      atinge_meta_aereas: "1 se aereas_pct >= 50."
      atinge_meta_varejo: "1 se varejo_pct >= 20."

  gold_resgates_mensal:
    grao: "1 linha por mês x modalidade"
    descricao: "Volume, usuários, cancelamentos e custo dos resgates por mês e modalidade."
    colunas:
      mes: "Mês do resgate (YYYY-MM)."
      modalidade: "AEREAS, VAREJO_PRODUTO, TRANSFERENCIA_PARCEIRO ou PIX."
      itens_total: "Itens de resgate em qualquer status."
      itens_aprovados: "Itens com status APROVADO."
      itens_cancelados_invalidos: "Itens CANCELADO ou INVALIDO (não debitam pontos)."
      itens_estornados: "Itens ESTORNADO (pontos devolvidos)."
      pontos_aprovados: "Pontos de itens aprovados."
      pontos_aprovados_sem_lote: "Pontos aprovados excluindo o lote de 12/01/2026."
      pontos_estornados: "Pontos de itens estornados."
      usuarios_aprovados: "Usuários distintos com resgate aprovado."
      valor_produto_reais: "Valor em R$ dos produtos aprovados (inclui copagamento)."
      copagamento_reais: "R$ pagos pelo cliente além dos pontos."
      custo_pontos_reais: "valor_produto_reais - copagamento_reais: custo coberto por pontos."
      custo_por_ponto_reais: "R$ por ponto resgatado. Pix = 0,019."

  gold_fct_resgate:
    grao: "1 linha por item de resgate (order_item_id), todos os status"
    descricao: "Fato detalhado de resgates. Use para cortes não previstos nos agregados (canal, fornecedor, classe de cartão)."
    colunas:
