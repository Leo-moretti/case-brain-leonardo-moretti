      resgatou_antes_pix: "1 se tinha resgate aprovado antes de 27/05/2026."

  gold_pontos_mensal:
    grao: "1 linha por mês"
    descricao: "Movimentação do saldo de pontos (ledger): créditos, migração, resgates, estornos, expirações e saldo acumulado (passivo)."
    colunas:
